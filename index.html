<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future - AI Companion</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23D48C6B'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='white' font-family='Arial'>F</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css" />
</head>
<body>
    
    <div class="chat-sidebar" id="chatSidebar">
        <div class="chat-sidebar-header">
            <h3><i class="fas fa-history"></i> Chats</h3>
            <button onclick="closeSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <div id="chatList"></div>
        <button class="new-chat-btn" onclick="createNewChat()">
            <i class="fas fa-plus-circle"></i> New Chat
        </button>
    </div>

    
    <div class="overlay" id="overlay">
        <div class="overlay-glow"></div>
        <div class="overlay-content">
            <div class="overlay-icon"><i class="fas fa-comment-dots"></i></div>
            <div class="waveform-container">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <div class="overlay-status" id="overlayStatus">🎤 Press "Speak" to start talking</div>
            <div class="overlay-text-box" id="overlayTextBox">
                <span class="placeholder" id="placeholderText">Your conversation will appear here...</span>
                <span id="overlayConversation"></span>
                <span class="cursor"></span>
            </div>
            <div class="overlay-controls">
                <button class="overlay-btn close" onclick="closeOverlay()">
                    <i class="fas fa-times"></i> Close
                </button>
                <button class="overlay-btn speak" id="overlaySpeakBtn" onclick="toggleOverlaySpeaking()">
                    <i class="fas fa-microphone"></i> Speak
                </button>
            </div>
        </div>
    </div>

    
    <div class="api-setup" id="apiSetup">
        <div class="title"><i class="fas fa-key"></i> Enter Your Gemini API Key</div>
        <div class="api-input-group">
            <input id="apiKeyInput" type="password" placeholder="Paste your Gemini API key here..." />
            <button onclick="setAPIKey()"><i class="fas fa-save"></i> Save Key</button>
        </div>
        <div class="hint"><i class="fas fa-info-circle"></i> Your key is stored locally in your browser</div>
    </div>

    
    <div class="image-preview-container" id="imagePreviewContainer">
        <div class="image-preview">
            <img id="imagePreview" src="" alt="Image preview" />
            <span class="file-name" id="imageFileName">image.jpg</span>
            <span class="file-size" id="imageFileSize"></span>
            <button class="remove-image" onclick="removeImage()"><i class="fas fa-times-circle"></i></button>
        </div>
    </div>

    
    <div class="chat-container" id="chatContainer">
        <div id="chat"></div>
        <div class="typing" id="typingIndicator">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    
    <div class="bottom-bar">
        <!-- Status Bar -->
        <div id="status" class="status">
            <span class="dot"></span>
            <span class="future-badge"><i class="fas fa-robot"></i> Future</span>
            <span id="statusText">Ready</span>
        </div>
        
        <!-- Input Row -->
        <div class="input-row">
            <button class="menu-btn" onclick="toggleSidebar()" title="Chat History">
                <i class="fas fa-bars"></i>
            </button>
            <button class="clear-btn" onclick="clearChat()" title="Clear Chat">
                <i class="fas fa-trash"></i>
            </button>
            
            <div class="input-wrapper">
                <input id="userInput" type="text" placeholder="Type a message..." autocomplete="off" />
                <button class="send-btn" id="sendBtn" onclick="sendMessage(false)" title="Send">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            
            <div class="voice-buttons">
                <button class="image-btn" onclick="document.getElementById('imageInput').click()" title="Upload Image">
                    <i class="fas fa-image"></i>
                </button>
                <input type="file" id="imageInput" accept="image/*" style="display:none" />
                <button class="voice-btn" id="voiceBtn" onclick="startVoice(false)" title="Speak (text response)">
                    <i class="fas fa-microphone"></i>
                </button>
                <button class="talk-btn" id="talkBtn" onclick="openOverlay()" title="Talk Mode">
                    <i class="fas fa-comment-dots"></i>
                </button>
                <button class="api-change-btn" onclick="changeAPIKey()" title="Change API Key">
                    <i class="fas fa-key"></i>
                </button>
            </div>
        </div>
    </div>

<script type="text/javascript" src="index.js">
  
</script>
</body>
</html>
